name: Verify indexed fallback
on:
  push:
    branches: [fix/indexed-translation-fallback-20261101]
    paths: [.github/workflows/prepare-indexed-retry.yml, .qa/prepare-indexed-retry.mjs]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: node .qa/prepare-indexed-retry.mjs
      - run: npm ci --no-audit --no-fund
      - name: Complete validation before candidate commit
        shell: bash
        run: |
          set -euo pipefail
          npm run ci 2>&1 | tee /tmp/indexed-fallback-ci.log
      - name: Commit only the verified production fix and regression tests
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/indexed-translation-fallback-20261101
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/localhost.ts test/localhost.test.ts
          git commit -m 'fix: retry only echoed indexed translation fragments once'
          git push origin HEAD:fix/indexed-translation-fallback-20261101
          git rev-parse HEAD > /tmp/indexed-fallback-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: indexed-fallback-validation
          path: |
            /tmp/indexed-fallback-ci.log
            /tmp/indexed-fallback-commit.txt
          retention-days: 7
