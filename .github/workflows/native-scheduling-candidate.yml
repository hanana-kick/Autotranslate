name: Native scheduling candidate verification
on:
  push:
    branches: [fix/review-hardening-20261031]
    paths: ['.github/workflows/native-scheduling-candidate.yml']
permissions:
  contents: read
jobs:
  candidate:
    strategy:
      fail-fast: false
      matrix:
        option: [yield-after-count, matching-warmup]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Record explicit source candidate before build
        env:
          CANDIDATE: ${{ matrix.option }}
        run: |
          mkdir -p test-results/native-extension
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          const path='src/lib/localhost.ts';
          assert.equal(execFileSync('git',['hash-object',path],{encoding:'utf8'}).trim(),'cb2da0f0b986e85cc716e5a4e7f961b032e25b33');
          let source=fs.readFileSync(path,'utf8');
          if(process.env.CANDIDATE==='yield-after-count') {
            const anchor='    const reply = await generate(batch);';
            assert.ok(source.includes(anchor));
            source=source.replace(anchor,'    await new Promise<void>((resolve) => setTimeout(resolve, 0));\n'+anchor);
          } else {
            const anchor="L.wrapChatPrompt('Translate to Korean: Good morning.')";
            assert.ok(source.includes(anchor));
            source=source.replace(anchor,"L.buildTranslatePrompt('en', 'ko', 'Good morning.')");
          }
          fs.writeFileSync(path,source);
          fs.writeFileSync('test-results/native-extension/candidate.json',JSON.stringify({candidate:process.env.CANDIDATE,originalSourceBlob:'cb2da0f0b986e85cc716e5a4e7f961b032e25b33',changedSourceBlob:execFileSync('git',['hash-object',path],{encoding:'utf8'}).trim(),runtimeUnchanged:true,modelUnchanged:true},null,2));
          JS
          git diff -- src > test-results/native-extension/candidate.patch
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck && npm run pretest && node --test test/localhost.test.ts test/worker-host.test.ts
      - run: npm run build:chrome
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.57.0
      - run: npx playwright install --with-deps chromium
      - name: Actual candidate extension, original SDK and default task model
        env:
          HEADED: '1'
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          (while true; do date -u; free -m; ps -eo pid,ppid,comm,pcpu,rss,stat --sort=-pcpu | head -18; sleep 10; done) > test-results/native-extension/resources.txt &
          monitor=$!
          trap 'kill "$monitor" 2>/dev/null || true' EXIT
          xvfb-run -a node test/diagnostics/run-native-diagnostic.mjs 2>&1 | tee test-results/native-extension/execution.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-scheduling-${{ matrix.option }}-${{ github.run_id }}
          path: test-results/native-extension/
          retention-days: 7
