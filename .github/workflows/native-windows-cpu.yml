name: Real extension Windows CPU
on:
  workflow_dispatch:
  push:
    branches: [fix/review-hardening-20261031]
    paths: ['.github/workflows/native-windows-cpu.yml']
permissions:
  contents: read
jobs:
  original-runtime:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:chrome
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.64.1
      - run: npx playwright install chromium
      - name: Select actual Windows software graphics, changing only browser launch arguments
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const path='test/native-extension/real-extension.mjs';
          const text=fs.readFileSync(path,'utf8'),from="'--use-angle=swiftshader',";
          assert.equal(text.split(from).length,2);
          fs.writeFileSync(path,text.replace(from,"'--use-angle=d3d11-warp', '--use-webgpu-adapter=default',"));
          JS
      - name: Verify real WebGPU adapter without credentials
        run: |
          mkdir -p test-results/native-extension
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {createServer} from 'node:http';
          import {chromium} from 'playwright';
          import assert from 'node:assert/strict';
          const args=['--use-angle=d3d11-warp','--use-webgpu-adapter=default','--enable-unsafe-webgpu','--enable-unsafe-swiftshader'];
          const server=createServer((req,res)=>res.end('<!doctype html><title>WebGPU preflight</title>'));
          await new Promise(r=>server.listen(0,'127.0.0.1',r));
          const browser=await chromium.launch({channel:'chromium',headless:false,args});
          try {
            const page=await browser.newPage();await page.goto(`http://127.0.0.1:${server.address().port}`);
            const adapter=await page.evaluate(async()=>{const a=await navigator.gpu?.requestAdapter({powerPreference:'high-performance'});return a?{vendor:a.info.vendor,architecture:a.info.architecture,description:a.info.description,device:a.info.device,isFallbackAdapter:a.isFallbackAdapter,features:[...a.features],maxBufferSize:a.limits.maxBufferSize}:null;});
            fs.writeFileSync('test-results/native-extension/adapter-preflight.json',JSON.stringify({browser:browser.version(),args,adapter},null,2));
            console.log(JSON.stringify(adapter));assert.ok(adapter,'real adapter available');
            assert.match(JSON.stringify(adapter),/microsoft|warp|basic render/i,'native Windows software backend must really be selected');
          } finally {await browser.close();await new Promise(r=>server.close(r));}
          JS
      - name: Test installed extension, unchanged SDK and real task model through UI
        env:
          HEADED: '1'
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          node test/native-extension/real-extension.mjs 2>&1 | tee test-results/native-extension/execution.log
      - name: Verify unchanged product code
        if: always()
        run: git diff --exit-code -- src package.json package-lock.json scripts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-extension-windows-${{ github.run_id }}
          path: test-results/native-extension/
          if-no-files-found: error
          retention-days: 14
