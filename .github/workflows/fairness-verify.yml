name: Verify feed fairness fixes
on:
  push:
    branches: [fix/review-hardening-20261031]
    paths: ['.github/workflows/fairness-verify.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply exact reviewed source proposal
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import zlib from 'node:zlib';import crypto from 'node:crypto';import assert from 'node:assert/strict';import{execFileSync}from'node:child_process';
          const data='';
          const patch=zlib.brotliDecompressSync(Buffer.from(data,'base64'));assert.equal(crypto.createHash('sha256').update(patch).digest('hex'),'6cc93210e7e39a92c3c3b358160bc1f035d49f3bcf2252cd88b4cfdbed0049b3');
          const paths=[...patch.toString().matchAll(/^diff --git a\/(.+) b\/(.+)$/gm)].map(m=>m[2]);execFileSync('git',['diff','--exit-code','15afd826557f2bfd82b427dafb0ab359f539143a','HEAD','--',...paths]);
          fs.mkdirSync('/tmp/feed-export',{recursive:true});fs.writeFileSync('/tmp/feed-export/paths.json',JSON.stringify(paths));fs.writeFileSync('/tmp/feed.patch',patch);execFileSync('git',['apply','--index','/tmp/feed.patch'],{stdio:'inherit'});execFileSync('git',['diff','--cached','--check'],{stdio:'inherit'});
          JS
      - run: npm ci --no-audit --no-fund && npm run typecheck && npm test && npm run build:chrome
      - name: Export verified source blobs without updating a branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import fs from'node:fs';import{execFileSync}from'node:child_process';const api=async(p,b)=>{const r=await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/${p}`,{method:b?'POST':'GET',headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},...(b?{body:JSON.stringify(b)}:{})});const d=await r.json();if(!r.ok)throw Error(`${p}:${r.status}`);return d;};const parent=process.env.GITHUB_SHA,base=await api(`git/commits/${parent}`),entries=[];
          for(const path of JSON.parse(fs.readFileSync('/tmp/feed-export/paths.json','utf8'))){const blob=await api('git/blobs',{content:fs.readFileSync(path,'utf8'),encoding:'utf-8'});if(blob.sha!==execFileSync('git',['hash-object',path],{encoding:'utf8'}).trim())throw Error('hash mismatch');entries.push({path,mode:'100644',type:'blob',sha:blob.sha});}fs.writeFileSync('/tmp/feed-export/blobs.json',JSON.stringify({parent,baseTree:base.tree.sha,entries},null,2));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feed-verification-${{ github.run_id }}
          path: /tmp/feed-export/
          retention-days: 2
