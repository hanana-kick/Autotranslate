name: Native tokenizer isolation
on:
  push:
    branches: [fix/review-hardening-20261031]
    paths: ['.github/workflows/native-tokenizer-isolation.yml']
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare recorded source candidate, not a runtime substitute
        run: |
          mkdir -p test-results/native-extension
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          const p='src/lib/localhost.ts';
          assert.equal(execFileSync('git',['hash-object',p],{encoding:'utf8'}).trim(),'cb2da0f0b986e85cc716e5a4e7f961b032e25b33');
          let s=fs.readFileSync(p,'utf8');
          const anchor='    const counted = llm?.sizeInTokens?.(text);';
          assert.ok(s.includes(anchor));
          s=s.replace(anchor,'    if (state.softwareRendering) return new TextEncoder().encode(text).length + 4;\n'+anchor);
          fs.writeFileSync(p,s);
          fs.writeFileSync('test-results/native-extension/candidate.json',JSON.stringify({candidate:'software-conservative-byte-budget-without-native-count',modelUnchanged:true,runtimeUnchanged:true,originalSourceBlob:'cb2da0f0b986e85cc716e5a4e7f961b032e25b33',sourceBlob:execFileSync('git',['hash-object',p],{encoding:'utf8'}).trim()},null,2));
          JS
          git diff -- src > test-results/native-extension/candidate.patch
      - run: npm ci --no-audit --no-fund && npm run typecheck && npm run build:chrome
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.57.0
      - run: npx playwright install --with-deps chromium
      - name: Run actual installed candidate through original extension UI
        env:
          HEADED: '1'
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          (while true; do date -u; free -m; ps -eo pid,ppid,comm,pcpu,rss,stat --sort=-pcpu | head -18; sleep 10; done) > test-results/native-extension/resources.txt &
          monitor=$!
          trap 'kill "$monitor" 2>/dev/null || true' EXIT
          xvfb-run -a node test/diagnostics/run-native-diagnostic.mjs 2>&1 | tee test-results/native-extension/execution.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-tokenizer-isolation-${{ github.run_id }}
          path: test-results/native-extension/
          retention-days: 7
