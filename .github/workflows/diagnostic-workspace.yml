name: Diagnostic workspace
on:
  push:
    branches: [fix/review-hardening-20261031]
    paths: ['.github/workflows/diagnostic-workspace.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: |
          mkdir -p /tmp/native-source
          git archive HEAD > /tmp/native-source/source.tar
          tar -czf /tmp/native-source/deps.tar.gz node_modules
          git rev-parse HEAD > /tmp/native-source/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: native-source-workspace
          path: /tmp/native-source/
          retention-days: 2
