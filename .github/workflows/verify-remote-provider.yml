name: Verify OpenAI-compatible remote provider implementation
on:
  push:
    branches: [feat/openai-compatible-remote-translation]
    paths: [.github/workflows/verify-remote-provider.yml]
permissions:
  contents: write
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Apply exact source patch from immutable Git blob
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          import assert from 'node:assert/strict';
          const sha='3e7108cbe0a2a815a7feb297d0afb6e68671bb8b';
          const expected='bc4f4bdd7cd47d0daac29e71361d96fd92250e5484d8ce7935a83ffc229dde25';
          const res=await fetch('https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY+'/git/blobs/'+sha,{
            headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'}
          });
          assert.equal(res.ok,true,'cannot fetch pinned patch');
          const b=await res.json();
          assert.equal(b.sha,sha);assert.equal(b.encoding,'base64');
          const patch=Buffer.from(b.content,'base64');
          assert.equal(createHash('sha256').update(patch).digest('hex'),expected,'patch digest mismatch');
          fs.writeFileSync('/tmp/autotranslate-remote.patch',patch);
          execFileSync('git',['apply','--check','--binary','/tmp/autotranslate-remote.patch'],{stdio:'inherit'});
          execFileSync('git',['apply','--binary','/tmp/autotranslate-remote.patch'],{stdio:'inherit'});
          execFileSync('git',['diff','--check'],{stdio:'inherit'});
          execFileSync('git',['diff','--exit-code','--','src/lib/local.ts','src/lib/localhost.ts','src/inference-worker.ts'],{stdio:'inherit'});
          console.log('Pinned source applied; actual MediaPipe host and worker unchanged');
          JS
      - run: npm ci --no-audit --no-fund
      - name: Full original unit, type, format and both browser package checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/remote-provider
          npm run ci 2>&1 | tee test-results/remote-provider/node-ci.log
      - name: Install real Chromium browser regression driver
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Real installed Chrome extension and remote HTTP integration
        shell: bash
        run: |
          set -euo pipefail
          npm run test:browser 2>&1 | tee test-results/remote-provider/browser-ci.log
      - name: Export only proven source blobs for connector-side commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          import assert from 'node:assert/strict';
          // The temporary workflow is not part of the verified product.
          fs.rmSync('.github/workflows/verify-remote-provider.yml');
          execFileSync('git',['add','-A']);
          const paths=execFileSync('git',['diff','--cached','--name-only','-z']).toString().split('\0').filter(Boolean);
          assert.ok(paths.length>=26&&paths.length<=40,'unexpected changed file count');
          const allow=/^(README\.md|docs\/openai-compatible\.md|package(-lock)?\.json|scripts\/package-spec\.ts|src\/|test\/|\.github\/workflows\/(remote-provider-export|verify-remote-provider)\.yml)$/;
          for(const p of paths)assert.ok(allow.test(p),'unexpected path '+p);
          async function api(path,method='GET',body){
            const result=await fetch('https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY+path,
              {method,headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json',
              'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
            if(!result.ok)throw Error(path+' '+result.status+': '+(await result.text()).slice(0,200));
            return result.json();
          }
          const commit=await api('/git/commits/'+process.env.GITHUB_SHA);
          const entries=[];const sources=[];
          for(const p of paths){
            if(!fs.existsSync(p)){
              entries.push({path:p,mode:'100644',type:'blob',sha:null});
              sources.push({path:p,deleted:true});
              continue;
            }
            const content=fs.readFileSync(p);
            const uploaded=await api('/git/blobs','POST',{content:content.toString('base64'),encoding:'base64'});
            entries.push({path:p,mode:'100644',type:'blob',sha:uploaded.sha});
            sources.push({path:p,sha256:createHash('sha256').update(content).digest('hex'),size:content.length});
          }
          const payload={baseHead:process.env.GITHUB_SHA,baseTree:commit.tree.sha,entries,sources,
            qa:'TypeScript/unit/build/packaging and actual Chrome extension HTTP test with deterministic server, no real vLLM',fullQAPassed:true};
          fs.mkdirSync('test-results/remote-provider',{recursive:true});
          fs.writeFileSync('test-results/remote-provider/verified-manifest.json',JSON.stringify(payload,null,2));
          const manifest=await api('/git/blobs','POST',{content:JSON.stringify(payload),encoding:'utf-8'});
          console.log('VERIFIED_MANIFEST_BLOB='+manifest.sha);
          console.log('VERIFIED_ENTRIES='+entries.length);
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remote-provider-qa-${{ github.run_id }}
          path: |
            test-results/remote-provider/
            test-results/remote-http/
            test-results/browser/
          retention-days: 7
          if-no-files-found: warn
