name: Real installed extension
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund && npm run build:chrome
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.57.0
      - run: npx playwright install --with-deps chromium
      - name: Actual installed extension
        env:
          HEADED: '1'
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          NATIVE_GPU_BACKEND: metal
        run: node test/native-extension/real-extension.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-extension-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/native-extension/
          retention-days: 14
