name: Prepare native execution adjustment
on:
  push:
    branches: [fix/review-hardening-20261031]
    paths: ['.github/workflows/native-adjustment.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply integrity-checked changes
        run: |
          mkdir -p /tmp/native-adjustment
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import {gunzipSync} from 'node:zlib';
          import {createHash} from 'node:crypto';
          const payload='';
          fs.writeFileSync('/tmp/native-adjustment/transport.b64',payload);
          const sha=createHash('sha256').update(payload).digest('hex');console.log('payload',sha);
          if(sha!=='3a0a729539aa17a572810ed6dd3f2690bf9f2901f13b66b356de4e3729dd29f7')throw Error('transport digest mismatch');
          const records=JSON.parse(gunzipSync(Buffer.from(payload,'base64')));
          const allowed=new Set(['.github/workflows/native-extension.yml','src/lib/local.ts','src/lib/localhost.ts','test/localhost.test.ts','test/native-extension/real-extension.mjs','test/worker-host.test.ts']);
          for(const r of records){
            if(!allowed.delete(r.path)||execFileSync('git',['hash-object',r.path],{encoding:'utf8'}).trim()!==r.before)throw Error('base/path mismatch');
            execFileSync('git',['apply','--check','-'],{input:r.patch});execFileSync('git',['apply','-'],{input:r.patch});
            if(execFileSync('git',['hash-object',r.path],{encoding:'utf8'}).trim()!==r.after)throw Error('result mismatch');
          }
          if(allowed.size)throw Error('missing files');
          fs.writeFileSync('/tmp/native-records.json',JSON.stringify(records.map(({path,after})=>({path,after}))));
          NODE
      - run: npm ci --no-audit --no-fund
      - name: Validate changed source and supervision contracts
        run: |
          npm run typecheck
          npm run pretest
          node --test test/worker-host.test.ts test/localhost.test.ts test/local.test.ts
          node --check test/native-extension/real-extension.mjs
          npm run build:chrome
      - name: Export validated blobs without moving branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const root=`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/`;
          async function api(path,body){const r=await fetch(root+path,{method:body?'POST':'GET',headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});const d=await r.json();if(!r.ok)throw Error(`${path}: ${r.status}`);return d;}
          const parent=process.env.GITHUB_SHA,base=await api(`git/commits/${parent}`),entries=[];
          for(const x of JSON.parse(fs.readFileSync('/tmp/native-records.json','utf8'))){const b=await api('git/blobs',{content:fs.readFileSync(x.path,'utf8'),encoding:'utf-8'});if(b.sha!==x.after)throw Error('blob mismatch');entries.push({path:x.path,mode:'100644',type:'blob',sha:b.sha});}
          const result={parent,baseTree:base.tree.sha,entries};console.log(JSON.stringify(result));fs.writeFileSync('/tmp/native-adjustment/blobs.json',JSON.stringify(result,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-adjustment-${{ github.run_id }}
          path: /tmp/native-adjustment/
          retention-days: 3
