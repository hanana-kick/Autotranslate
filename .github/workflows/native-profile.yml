name: Native inference CPU profile
on:
  push:
    branches: [fix/review-hardening-20261031]
    paths: ['.github/workflows/native-profile.yml']
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund && npm run build:chrome
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.57.0
      - run: npx playwright install --with-deps chromium
      - name: Prepare read-only profiling driver
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          let s=fs.readFileSync('test/native-extension/real-extension.mjs','utf8');
          function patch(a,b){assert.ok(s.includes(a));s=s.replace(a,b);}
          s="import {observeNativeCPU} from './test/diagnostics/profile-native-worker.mjs';\nimport {observeExtensionRuntime} from './test/diagnostics/observe-extension-runtime.mjs';\n"+s;
          patch('let context, server, welcome, options, page;', 'let context, server, welcome, options, page, stopCPU, stopEvents;');
          patch('context.setDefaultTimeout(30000);', 'stopCPU=await observeNativeCPU(context,out,clean); stopEvents=await observeExtensionRuntime(context,out,clean); context.setDefaultTimeout(30000);');
          patch('async function host(p) {', `async function host(p) {
            const events=await readFile(join(out,'runtime-events.json'),'utf8').then(JSON.parse).catch(()=>[]);
            const fatal=events.find(e=>e.level==='error' && /CalculatorGraph::Run.*failed|DEADLINE_EXCEEDED/.test(e.message));
            if(fatal) throw new Error('Original native graph failed: '+fatal.message);
          `);
          patch("  if (context) await bound(context.close(),", "  if(stopCPU) await stopCPU(); if(stopEvents) await stopEvents();\n  if (context) await bound(context.close(),");
          fs.writeFileSync('.native-profile-run.mjs',s);
          JS
      - name: Actual installed extension with original model and read-only CPU profiling
        env:
          HEADED: '1'
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/native-extension
          (while true; do date -u; free -m; ps -eo pid,ppid,comm,pcpu,rss,stat --sort=-pcpu | head -18; sleep 10; done) > test-results/native-extension/resources.txt &
          monitor=$!
          trap 'kill "$monitor" 2>/dev/null || true' EXIT
          xvfb-run -a node .native-profile-run.mjs 2>&1 | tee test-results/native-extension/execution.log
      - name: Verify no application modifications
        if: always()
        run: git diff --exit-code -- src scripts package.json package-lock.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-profile-${{ github.run_id }}
          path: test-results/native-extension/
          retention-days: 7
