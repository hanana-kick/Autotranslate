name: Release

# Publish only after both deterministic browser regressions AND real installed
# extension inference/restoration pass. Gated model access uses HF_TOKEN.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  browser:
    uses: ./.github/workflows/browser.yml
    permissions:
      contents: read

  native:
    uses: ./.github/workflows/native-extension.yml
    permissions:
      contents: read
    secrets:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

  release:
    needs: [browser, native]
    name: Package and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-extension
      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum ./*.zip > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
      - name: Publish the release for this version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          files=(dist/*.zip dist/SHA256SUMS.txt)
          notes="$RUNNER_TEMP/notes.md"
          {
            echo "Autotranslate $version, built from \`${GITHUB_SHA::12}\`."
            echo
            echo "- workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- real installed extension: original SDK/model, translation and exact HTML restoration"
            echo
            echo "Chrome: unzip, then load the folder from chrome://extensions with"
            echo "Developer mode on. Firefox: install the zip as a temporary add-on from"
            echo "about:debugging, or sign it with web-ext."
          } > "$notes"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" --title "Autotranslate $version" --notes-file "$notes" --target "$GITHUB_SHA"
          fi
          gh release view "$tag"
