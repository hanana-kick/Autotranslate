name: Release (Chrome)

# Browser/planner regressions and reproducible builds gate publication.
# Original-model inference and speed certification use separate native harnesses.
# No Firefox archive is published; its on-device path remains unverified.
on:
  push:
    branches: [main]
permissions:
  contents: write
  actions: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  browser:
    uses: ./.github/workflows/browser.yml
    permissions:
      contents: read
  planner:
    uses: ./.github/workflows/planner-audit.yml
    permissions:
      contents: read
  release:
    needs: [browser, planner]
    name: Publish the reproducible Chrome package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-extension
      - name: Record release archive checksum
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          assert.match(version, /^\d+\.\d+\.\d+$/, 'a release needs a plain semantic version');
          const archive = 'dist/autotranslate-' + version + '-chrome.zip';
          const sha = createHash('sha256').update(fs.readFileSync(archive)).digest('hex');
          fs.writeFileSync('dist/SHA256SUMS.txt', sha + '  ' + path.basename(archive) + '\n');
          console.log(JSON.stringify({ version, sha256: sha }));
          JS
      - name: Publish Chrome with explicit verification scope
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          notes="$RUNNER_TEMP/release-notes.md"
          cat > "$notes" <<EOF
          Autotranslate $version — Chrome, built from \`${GITHUB_SHA::12}\`.

          - Translation runs on-device with the published PLaMo 3 Translate ONNX export; page text stays in the browser.
          - Per-tab ON/OFF, source-bound side panel/separate options window, dynamic DOM translation and current-source restoration are retained.
          - Type/unit/package, deterministic browser, planner and reproducible-build gates passed. SHA256SUMS.txt identifies this archive.
          - These gates do not certify a fresh native-model run or a local-inference speed benchmark. No Firefox archive is published; its on-device execution remains unverified.

          Verification run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          Setup: Options → download or select an on-device model → Save → explicitly enable the intended tab.
          EOF
          # Publishing the same version twice must be a no-op, not a red build:
          # every push to main triggers this workflow, including a docs-only one.
          # Different bytes under a version already out there is the case that
          # must fail, and does.
          if gh release view "$tag" >/dev/null 2>&1; then
            published="$(mktemp)"
            gh release download "$tag" -p '*-chrome.zip' -O "$published" --clobber >/dev/null
            shipped="$(cut -d' ' -f1 dist/SHA256SUMS.txt)"
            if [ "$(shasum -a 256 "$published" | cut -d' ' -f1)" = "$shipped" ]; then
              echo "v$version already publishes this exact archive ($shipped); nothing to do."
              exit 0
            fi
            echo 'An existing release is never silently overwritten.' >&2
            exit 1
          fi
          gh release create "$tag" dist/*-chrome.zip dist/SHA256SUMS.txt --title "Autotranslate $version (Chrome)" --notes-file "$notes" --target "$GITHUB_SHA"
          gh release view "$tag"
