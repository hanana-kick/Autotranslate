name: Release

# Main is an integration branch. Publishing both browser packages requires both
# original-model runtimes, deterministic regressions, planner and package checks.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  browser:
    uses: ./.github/workflows/browser.yml
    permissions:
      contents: read
  planner:
    uses: ./.github/workflows/planner-audit.yml
    permissions:
      contents: read
  native:
    uses: ./.github/workflows/native-extension.yml
    permissions:
      contents: read
    secrets:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
  firefox:
    uses: ./.github/workflows/firefox-native.yml
    permissions:
      contents: read
    secrets:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
  release:
    needs: [browser, native, firefox, planner]
    name: Package and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-extension
      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum ./*.zip > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
      - name: Publish the release for this version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          files=(dist/*.zip dist/SHA256SUMS.txt)
          notes="$RUNNER_TEMP/notes.md"
          {
            echo "Autotranslate $version, built from \`${GITHUB_SHA::12}\`."
            echo
            echo "- workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- original SDK/model: Chrome and Firefox installed-extension checks"
            echo "- static and dynamic translation, exact HTML restoration and planner acceptance"
            echo
            echo "Chrome: unzip and load from chrome://extensions in Developer mode."
            echo "Firefox: temporary installation from about:debugging, or sign with web-ext."
          } > "$notes"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" --title "Autotranslate $version" --notes-file "$notes" --target "$GITHUB_SHA"
          fi
          gh release view "$tag"
