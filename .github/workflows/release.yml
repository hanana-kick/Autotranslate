name: Release (Chrome validated)

# Publish Chrome ONLY when original installed Chrome/model E2E, deterministic
# browser, planner, paired native speed and reproducible package checks pass.
# Firefox native preparation still fails (issue #2); its ZIP is NOT released.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  browser:
    uses: ./.github/workflows/browser.yml
    permissions:
      contents: read
  planner:
    uses: ./.github/workflows/planner-audit.yml
    permissions:
      contents: read
  native:
    uses: ./.github/workflows/native-extension.yml
    permissions:
      contents: read
    secrets:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
  speed:
    uses: ./.github/workflows/native-speed-benchmark.yml
    permissions:
      contents: read
    secrets:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
  tab-ui:
    uses: ./.github/workflows/tab-ui.yml
    permissions:
      contents: read
  release:
    needs: [browser, native, planner, speed, tab-ui]
    name: Package and publish verified Chrome only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-extension
      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum ./*-chrome.zip > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
      - name: Publish the release for this version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          files=(dist/*-chrome.zip dist/SHA256SUMS.txt)
          notes="$RUNNER_TEMP/notes.md"
          {
            echo "Autotranslate $version — Chrome only, built from \`${GITHUB_SHA::12}\`."
            echo
            echo "- workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- original TranslateGemma .task and MediaPipe SDK in the installed Chrome extension; five independent fresh profiles"
            echo "- static and dynamic translation, exact HTML restoration and planner acceptance"
            echo "- same-machine native speed comparison against 0.1.3: long cached pages, inline links and foreground tab contention"
            echo "- explicit per-tab ON/OFF (new tabs OFF); chosen tabs survive reload and worker restart; OFF restores only that tab"
            echo "- source-bound Options use a side panel when supported, otherwise a separate window; window routing is separately tested in Firefox (not Firefox model compatibility)"
            echo
            echo "Chrome: unzip and load from chrome://extensions in Developer mode."
            echo "Firefox is NOT included: its genuine model preparation fails. See https://github.com/$GITHUB_REPOSITORY/issues/2"
          } > "$notes"
          if gh release view "$tag" >/dev/null 2>&1; then
            if gh release view "$tag" --json assets --jq '.assets[].name' | grep -q -- '-firefox\.zip'; then
              echo 'Refusing to change an existing multi-browser release without valid Firefox QA' >&2
              exit 1
            fi
            gh release upload "$tag" "${files[@]}" --clobber
            gh release edit "$tag" --title "Autotranslate $version (Chrome)" --notes-file "$notes"
          else
            gh release create "$tag" "${files[@]}" --title "Autotranslate $version (Chrome)" --notes-file "$notes" --target "$GITHUB_SHA"
          fi
          gh release view "$tag"
