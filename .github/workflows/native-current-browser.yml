name: Native extension current Chromium
on:
  push:
    branches: [fix/review-hardening-20261031]
    paths: ['.github/workflows/native-current-browser.yml']
permissions:
  contents: read
jobs:
  original:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund && npm run build:chrome
      - name: Resolve current official browser test tooling and record exact version
        run: |
          mkdir -p test-results/native-extension
          version=$(npm view playwright version)
          printf '%s\n' "$version" > test-results/native-extension/playwright-version.txt
          npm install --no-save --package-lock=false --ignore-scripts "playwright@$version"
          npx playwright install --with-deps chromium
      - name: Test unchanged installed extension with its original SDK and model
        env:
          HEADED: '1'
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          (while true; do date -u; free -m; ps -eo pid,ppid,comm,pcpu,rss,stat --sort=-pcpu | head -18; sleep 10; done) > test-results/native-extension/resources.txt &
          monitor=$!
          trap 'kill "$monitor" 2>/dev/null || true' EXIT
          xvfb-run -a node test/diagnostics/run-native-diagnostic.mjs 2>&1 | tee test-results/native-extension/execution.log
      - name: Verify unchanged application
        if: always()
        run: git diff --exit-code -- src scripts package.json package-lock.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-current-browser-${{ github.run_id }}
          path: test-results/native-extension/
          retention-days: 7
