name: Review validation

on:
  push:
    branches: [fix/review-hardening-20261031]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: review-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Validate baseline
        run: npm run ci
      - name: Package isolated review workspace
        if: always() && github.ref == 'refs/heads/fix/review-hardening-20261031'
        run: tar --exclude=.git --exclude=dist --exclude=build -czf "$RUNNER_TEMP/review-workspace.tar.gz" .
      - uses: actions/upload-artifact@v4
        if: always() && github.ref == 'refs/heads/fix/review-hardening-20261031'
        with:
          name: review-workspace
          path: ${{ runner.temp }}/review-workspace.tar.gz
          retention-days: 3
          if-no-files-found: error
