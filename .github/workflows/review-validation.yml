name: Review validation

on:
  push:
    branches: [fix/review-hardening-20261031]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: review-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.repository == 'hanana-kick/Autotranslate' && github.ref == 'refs/heads/fix/review-hardening-20261031'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Apply integrity-checked source changes
        shell: bash
        run: |
          set -euo pipefail
          if test -f .review-source.b64.0; then
            node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync, existsSync, mkdirSync } from 'node:fs';
          import { dirname } from 'node:path';
          import { createHash } from 'node:crypto';
          import { brotliDecompressSync } from 'node:zlib';
          const hash = value => createHash('sha256').update(value).digest('hex');
          const encoded = [0, 1].map(i => readFileSync(`.review-source.b64.${i}`, 'utf8').trim()).join('');
          const decoded = brotliDecompressSync(Buffer.from(encoded, 'base64'));
          if (hash(decoded) !== '6ca72c7d0f5e3ff892740e189af5787cbe957648c31061e66f49724fec26b269') throw new Error('source manifest checksum mismatch');
          const manifest = JSON.parse(decoded.toString('utf8'));
          if (manifest.version !== 1 || manifest.files.length !== 29) throw new Error('unexpected manifest');
          const prepared = [];
          for (const file of manifest.files) {
            const path = file.path;
            if (!/^(src\/|test\/|docs\/|README\.md$|package\.json$|\.gitignore$)/.test(path) || path.includes('..') || path.includes('\\')) throw new Error(`unsafe path: ${path}`);
            let result;
            if (file.base === null) {
              if (existsSync(path)) throw new Error(`new file already exists: ${path}`);
              result = file.content;
            } else {
              const before = readFileSync(path, 'utf8');
              if (hash(before) !== file.base) throw new Error(`base checksum mismatch: ${path}`);
              const lines = before.split('\n');
              for (const edit of [...file.edits].reverse()) lines.splice(edit.start, edit.remove, ...edit.insert);
              result = lines.join('\n');
            }
            if (hash(result) !== file.hash) throw new Error(`result checksum mismatch: ${path}`);
            prepared.push({ path, result });
          }
          for (const {path, result} of prepared) {
            mkdirSync(dirname(path), { recursive: true });
            writeFileSync(path, result);
          }
          console.log(`Verified and applied ${prepared.length} source files.`);
          NODE
            git rm .review-source.b64.0 .review-source.b64.1
            git add src test docs README.md package.json .gitignore
            git diff --cached --check
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix: harden translation sessions, model activation and native API contracts'
            git push origin HEAD:fix/review-hardening-20261031
          fi
          mkdir -p test-results/browser
          git rev-parse HEAD | tee test-results/source-commit.txt
          git config --local --unset-all http.https://github.com/.extraheader || true
      - run: npm ci --no-audit --no-fund
      - name: Typecheck, unit regressions, packaging and fresh clone
        shell: bash
        run: |
          set -euo pipefail
          npm run ci 2>&1 | tee test-results/full-ci.log
      - name: Install isolated browser tooling
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.57.0
      - run: npx playwright install --with-deps chromium
      - name: Native DOM and real extension integration
        shell: bash
        run: |
          set -euo pipefail
          npm run test:browser 2>&1 | tee test-results/browser/results.tap
      - name: Validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-evidence-${{ github.run_id }}
          path: test-results/
          retention-days: 14
          if-no-files-found: warn
