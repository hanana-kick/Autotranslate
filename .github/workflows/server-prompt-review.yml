name: Verify server prompt correction
on:
  push:
    branches: [feat/openai-compatible-server]
    paths: [.github/workflows/server-prompt-review.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply exact locally checked correction
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import assert from 'node:assert/strict';import {brotliDecompressSync} from 'node:zlib';import {createHash} from 'node:crypto';import {execFileSync} from 'node:child_process';
          const encoded='';
          const patch=brotliDecompressSync(Buffer.from(encoded,'base64'));
          assert.equal(createHash('sha256').update(patch).digest('hex'),'cefbc7a2892c5c4cf2f89fa120586566a9f7f7a5369e36a2a339857b40122c56');
          const file=process.env.RUNNER_TEMP+'/server.patch';fs.writeFileSync(file,patch);
          execFileSync('git',['apply','--check',file],{stdio:'inherit'});execFileSync('git',['apply',file],{stdio:'inherit'});
          execFileSync('git',['diff','--check'],{stdio:'inherit'});
          JS
      - run: npm ci --no-audit --no-fund
      - name: Full type, unit, build and package checks
        run: |
          set -euo pipefail
          mkdir -p test-results/server-review
          npm run ci 2>&1 | tee test-results/server-review/ci.log
      - name: Export verified source blobs without moving any branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import {createHash} from 'node:crypto';import assert from 'node:assert/strict';
          const entries=[];
          for(const path of ['src/lib/engines.ts','test/server-extension/e2e.mjs','test/server.test.ts']){
            const bytes=fs.readFileSync(path);
            const r=await fetch('https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY+'/git/blobs',{method:'POST',headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({content:bytes.toString('base64'),encoding:'base64'})});assert.ok(r.ok,'source blob '+r.status);const b=await r.json();
            entries.push({path,mode:'100644',type:'blob',sha:b.sha,sha256:createHash('sha256').update(bytes).digest('hex')});
          }
          fs.writeFileSync('test-results/server-review/verified.json',JSON.stringify({parent:process.env.GITHUB_SHA,entries,scope:'source/type/unit/build; real server E2E still required'},null,2));console.log(JSON.stringify({parent:process.env.GITHUB_SHA,entries}));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-server-prompt-${{ github.run_id }}
          path: test-results/server-review/
          retention-days: 3
