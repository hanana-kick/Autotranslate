name: Remote provider and concurrency QA
on:
  push:
    branches: [feat/openai-compatible-remote-translation]
    paths:
      - '.github/workflows/remote-concurrency-qa.yml'
      - '.github/prepare-remote-concurrency.mjs'
      - 'src/lib/remote.ts'
      - 'test/remote-concurrency.test.ts'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Assemble guarded provider source and prove local inference unchanged
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/prepare-remote-concurrency.mjs
      - run: npm ci --no-audit --no-fund
      - name: Focused shared concurrency and HTTP contract tests
        run: |
          set -euo pipefail
          mkdir -p test-results/remote-concurrency
          ./node_modules/.bin/tsc -p tsconfig.json
          node --test test/remote.test.ts test/remote-concurrency.test.ts 2>&1 | tee test-results/remote-concurrency/focused.log
      - name: Complete unit, type, build and Chrome/Firefox package regressions
        run: |
          set -euo pipefail
          npm run ci 2>&1 | tee test-results/remote-concurrency/full-ci.log
      - name: Install pinned real Chromium
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Actual installed extension, local regression and real HTTP fixture
        run: |
          set -euo pipefail
          npm run test:browser 2>&1 | tee test-results/remote-concurrency/browser.log
      - name: Export exact tested source blobs; do not move any branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import {execFileSync} from 'node:child_process';import {createHash} from 'node:crypto';import assert from 'node:assert/strict';
          const temporary=['.github/workflows/verify-remote-provider.yml','.github/workflows/concurrency-workspace.yml','.github/workflows/remote-concurrency-qa.yml','.github/prepare-remote-concurrency.mjs'];
          for(const path of temporary)fs.rmSync(path,{force:true});
          execFileSync('git',['add','-A']);
          const paths=execFileSync('git',['diff','--cached','--name-only','-z']).toString().split('\0').filter(Boolean);
          assert.ok(paths.length>20&&paths.length<60,'unexpected source changes '+paths.length);
          for(const path of paths)assert.ok(/^(src\/|test\/|docs\/openai-compatible\.md$|README\.md$|package(-lock)?\.json$|scripts\/package-spec\.ts$|\.github\/)/.test(path),'unapproved source '+path);
          const api=async(path,body)=>{const r=await fetch('https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY+path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});if(!r.ok)throw Error(path+' HTTP '+r.status);return r.json();};
          const base=await api('/git/commits/'+process.env.GITHUB_SHA);const entries=[];
          for(const path of paths){if(!fs.existsSync(path)){entries.push({path,mode:'100644',type:'blob',sha:null});continue;}const bytes=fs.readFileSync(path);const blob=await api('/git/blobs',{content:bytes.toString('base64'),encoding:'base64'});entries.push({path,mode:'100644',type:'blob',sha:blob.sha});}
          const data={parent:process.env.GITHUB_SHA,baseTree:base.tree.sha,entries,qa:'Actual Chrome extension and real HTTP protocol fixture, NOT a live vLLM model',localRuntimeUnchanged:true};
          const manifest=await api('/git/blobs',{content:JSON.stringify(data),encoding:'utf-8'});
          console.log('VERIFIED_MANIFEST_BLOB='+manifest.sha);
          fs.writeFileSync('test-results/remote-concurrency/verified.json',JSON.stringify({...data,manifest:manifest.sha},null,2));
          const packages=fs.readdirSync('dist').filter(x=>x.endsWith('-chrome.zip'));
          assert.equal(packages.length,1);
          const bytes=fs.readFileSync('dist/'+packages[0]);fs.copyFileSync('dist/'+packages[0],'test-results/remote-concurrency/'+packages[0]);
          fs.writeFileSync('test-results/remote-concurrency/package.sha256',createHash('sha256').update(bytes).digest('hex')+'  '+packages[0]+'\n');
          JS
      - name: Save logs and reproducible package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-concurrency-${{ github.run_id }}
          path: |
            test-results/remote-concurrency/
            test-results/remote-http/
            test-results/browser/
          if-no-files-found: warn
          retention-days: 14
