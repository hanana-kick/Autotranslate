name: Verify native snapshot ordering
on:
  push:
    branches: [fix/indexed-translation-fallback-20261101]
    paths: [.github/workflows/prepare-native-snapshot.yml, .qa/prepare-native-snapshot.mjs]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: node .qa/prepare-native-snapshot.mjs
      - run: npm ci --no-audit --no-fund
      - name: Full verification with original product code and strict native assertions
        shell: bash
        run: |
          set -euo pipefail
          npm run ci 2>&1 | tee /tmp/native-snapshot-ci.log
      - name: Commit the test-only correction and remove preparation helpers
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/indexed-translation-fallback-20261101
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/native-extension/real-extension.mjs
          git rm .qa/prepare-native-snapshot.mjs .github/workflows/prepare-native-snapshot.yml
          git commit -m 'test: read rendered DOM after completion state without relaxing native acceptance'
          git push origin HEAD:fix/indexed-translation-fallback-20261101
          git rev-parse HEAD > /tmp/native-snapshot-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-snapshot-validation
          path: |
            /tmp/native-snapshot-ci.log
            /tmp/native-snapshot-commit.txt
          retention-days: 7
