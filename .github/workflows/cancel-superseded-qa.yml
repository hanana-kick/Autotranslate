name: Retire superseded failed QA
on:
  push:
    branches: [fix/review-hardening-20261031]
    paths: [.github/workflows/cancel-superseded-qa.yml]
permissions:
  contents: read
  actions: write
jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancel only known superseded runs that already contain a failed job
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          const repo=process.env.GITHUB_REPOSITORY;
          const base=`https://api.github.com/repos/${repo}/actions/runs/`;
          const headers={Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json'};
          for(const id of [41268351542,41268351554]){
            const r=await fetch(base+id,{headers}); if(!r.ok)throw Error(`read ${id}: ${r.status}`);
            const run=await r.json();
            if(run.head_sha!=='3134dfd3a4b0f640c941a30e9a71db6aa9d6bc16')throw Error('run source changed');
            const jr=await fetch(base+id+'/jobs',{headers});if(!jr.ok)throw Error(`jobs ${id}: ${jr.status}`);
            const {jobs}=await jr.json();
            const failed=jobs.filter(j=>j.conclusion==='failure').map(j=>({id:j.id,name:j.name,conclusion:j.conclusion}));
            console.log(JSON.stringify({id,head:run.head_sha,status:run.status,failed,reason:'replaced by signed released-browser validation; failed completed jobs and artifacts are retained'}));
            if(run.status!=='completed' && failed.length){
              const c=await fetch(base+id+'/cancel',{method:'POST',headers});
              if(!c.ok && c.status!==409)throw Error(`cancel ${id}: ${c.status}`);
              console.log(JSON.stringify({id,cancelStatus:c.status}));
            }
          }
          JS
