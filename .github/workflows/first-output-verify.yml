name: Verify first-output recovery
on:
  push:
    branches: [fix/review-hardening-20261031]
    paths: ['.github/workflows/first-output-verify.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply verified first-output proposal
        run: |
          node --input-type=module <<'JS'
          import fs from'node:fs';import zlib from'node:zlib';import crypto from'node:crypto';import assert from'node:assert/strict';import{execFileSync}from'node:child_process';
          const data='';
          const patch=zlib.brotliDecompressSync(Buffer.from(data,'base64'));assert.equal(crypto.createHash('sha256').update(patch).digest('hex'),'610368af68a5320cca933e6f5271e259ee1c948591f83383941890f13a32a8b4');
          const paths=[...patch.toString().matchAll(/^diff --git a\/(.+) b\/(.+)$/gm)].map(m=>m[2]);execFileSync('git',['diff','--exit-code','84116936ae1d72d71cfa1f05e48ab339d6f460e2','HEAD','--',...paths]);
          fs.mkdirSync('/tmp/stall-export',{recursive:true});fs.writeFileSync('/tmp/stall-export/paths.json',JSON.stringify(paths));fs.writeFileSync('/tmp/stall.patch',patch);execFileSync('git',['apply','--index','/tmp/stall.patch'],{stdio:'inherit'});
          JS
      - run: npm ci --no-audit --no-fund && npm run typecheck && npm run pretest && node --test test/worker-host.test.ts test/localhost.test.ts && npm run build:chrome
      - name: Export validated source without moving branch refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import fs from'node:fs';import{execFileSync}from'node:child_process';const api=async(p,b)=>{const r=await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/${p}`,{method:b?'POST':'GET',headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},...(b?{body:JSON.stringify(b)}:{})});const d=await r.json();if(!r.ok)throw Error(`${p}:${r.status}`);return d;};const parent=process.env.GITHUB_SHA,base=await api(`git/commits/${parent}`),entries=[];for(const path of JSON.parse(fs.readFileSync('/tmp/stall-export/paths.json','utf8'))){const blob=await api('git/blobs',{content:fs.readFileSync(path,'utf8'),encoding:'utf-8'});if(blob.sha!==execFileSync('git',['hash-object',path],{encoding:'utf8'}).trim())throw Error('hash mismatch');entries.push({path,mode:'100644',type:'blob',sha:blob.sha});}fs.writeFileSync('/tmp/stall-export/blobs.json',JSON.stringify({parent,baseTree:base.tree.sha,entries},null,2));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: first-output-${{ github.run_id }}
          path: /tmp/stall-export/
          retention-days: 2
