name: Prepare worker isolation
on:
  push:
    branches: [fix/review-hardening-20261031]
    paths: ['.github/workflows/worker-repair.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify and apply staged changes
        shell: bash
        run: |
          mkdir -p /tmp/worker-evidence
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          import { gunzipSync } from 'node:zlib';
          import { execFileSync } from 'node:child_process';
          let input = fs.readFileSync('.maintenance/worker-repair.b64', 'utf8').trim();
          for (const [a,b] of [
            ['PCZfkcZZhjiss','PCZfkcZjhiss'],
            ['BmkWwzCs6YIVII','BmkWwz68YIVII'],
            ['J71ux7l9MIsMh','J71ux7wMIsMh'],
            ['XKdJJ5glI3a','XKdJ5glI3a']
          ]) input = input.replace(a,b);
          const hash = createHash('sha256').update(input).digest('hex');
          console.log('payload SHA256', hash);
          if (hash !== '0f77a459640949c169ba0ce8639080edd9ef09c437b7f06658c86a04f92e8c38') throw new Error('transport integrity mismatch');
          const records = JSON.parse(gunzipSync(Buffer.from(input,'base64')));
          const allowed = new Set(['src/lib/local.ts','src/lib/localhost.ts','src/inference-worker.ts','scripts/package-spec.ts','test/worker-host.test.ts','test/browser/extension.test.mjs','test/browser/fixtures/capabilities.js','test/browser/fixtures/runtime.mjs','test/native-extension/real-extension.mjs','.github/workflows/native-extension.yml']);
          if (records.length !== allowed.size) throw new Error('unexpected record count');
          for (const r of records) {
            if (!allowed.delete(r.path)) throw new Error('unexpected path');
            const actual = fs.existsSync(r.path) ? execFileSync('git',['hash-object',r.path],{encoding:'utf8'}).trim() : null;
            if (actual !== r.before) throw new Error('base mismatch: '+r.path);
            if (typeof r.content === 'string') fs.writeFileSync(r.path,r.content);
            else {
              execFileSync('git',['apply','--check','-'],{input:r.patch});
              execFileSync('git',['apply','-'],{input:r.patch});
            }
          }
          fs.writeFileSync('/tmp/worker-records.json',JSON.stringify(records.map(r=>r.path)));
          console.log('Applied', records.length, 'verified source files');
          NODE
      - run: npm ci --no-audit --no-fund
      - name: Validate source and worker supervision regressions
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm run pretest
          node --test test/worker-host.test.ts test/localhost.test.ts test/local.test.ts test/background.test.ts 2>&1 | tee /tmp/worker-evidence/regressions.log
          npm run build:chrome
      - name: Store verified file blobs without changing branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const repo=process.env.GITHUB_REPOSITORY;
          async function api(path,body) {
            const response=await fetch(`https://api.github.com/repos/${repo}/${path}`,{method:body?'POST':'GET',headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});
            const data=await response.json();
            if(!response.ok)throw new Error(`${path}: ${response.status} ${data.message}`);
            return data;
          }
          const parent=process.env.GITHUB_SHA;
          const base=await api(`git/commits/${parent}`);
          const entries=[];
          for(const path of JSON.parse(fs.readFileSync('/tmp/worker-records.json','utf8'))) {
            const blob=await api('git/blobs',{content:fs.readFileSync(path,'utf8'),encoding:'utf-8'});
            if(blob.sha!==execFileSync('git',['hash-object',path],{encoding:'utf8'}).trim())throw new Error('blob mismatch');
            entries.push({path,mode:'100644',type:'blob',sha:blob.sha});
          }
          const evidence={parent,baseTree:base.tree.sha,entries,branchMoved:false};
          fs.writeFileSync('/tmp/worker-evidence/prepared-blobs.json',JSON.stringify(evidence,null,2));
          console.log(JSON.stringify(evidence));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worker-preparation-${{ github.run_id }}
          path: /tmp/worker-evidence/
          retention-days: 3
