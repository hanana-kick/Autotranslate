name: Verify explicit tab candidate
on:
  push:
    branches: [feat/explicit-tab-translation]
    paths: [.github/workflows/tab-prepare.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Materialize exact reviewed candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/tab-verified
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          import {brotliDecompressSync} from 'node:zlib';
          const ids=['76a7dc53c60ebe21405659f37ef1c37c7534ef01','c9cefa288b0ea178410c5e1538d9b48ad289020c','c9b75c437491ca74c866f30e51474dd62e5c994c'];
          const parts=[];
          for(const id of ids){const r=await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/git/blobs/${id}`,{headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json'}});assert.ok(r.ok,'source object '+r.status);const b=await r.json();parts.push(Buffer.from(b.content,'base64'));}
          const patch=brotliDecompressSync(Buffer.concat(parts));
          const sha=createHash('sha256').update(patch).digest('hex');
          assert.equal(sha,'eff50f35a76bddcf8c62de60548c3110d98a0d250e765cea41afb7255d59004f');
          assert.equal(patch.length,116940);
          fs.writeFileSync('/tmp/tab.patch',patch);
          fs.writeFileSync('/tmp/tab-verified/provenance.json',JSON.stringify({base:process.env.GITHUB_SHA,patchSHA256:sha},null,2));
          JS
          git apply --check --unidiff-zero /tmp/tab.patch
          git apply --index --unidiff-zero /tmp/tab.patch
          git diff --cached --name-only > /tmp/tab-verified/paths.txt
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Local-only exact tab-control candidate for full source archive tests'
      - run: npm ci --no-audit --no-fund
      - name: Full candidate validation
        run: |
          set -euo pipefail
          npm run ci 2>&1 | tee /tmp/tab-verified/ci.log
          find test/tab-control test/native-extension test/speed test/dynamic-extension -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - name: Export verified blobs without moving any branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';import fs from 'node:fs';import {createHash} from 'node:crypto';
          const paths=fs.readFileSync('/tmp/tab-verified/paths.txt','utf8').trim().split('\n');const entries=[],hashes={};
          for(const path of paths){if(!fs.existsSync(path)){entries.push({path,mode:'100644',type:'blob',sha:null});continue;}
          const b=fs.readFileSync(path);hashes[path]=createHash('sha256').update(b).digest('hex');
          const r=await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/git/blobs`,{method:'POST',headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({content:b.toString('base64'),encoding:'base64'})});assert.ok(r.ok,'export '+path+' '+r.status);const result=await r.json();assert.ok(result.sha);entries.push({path,mode:'100644',type:'blob',sha:result.sha});}
          fs.writeFileSync('/tmp/tab-verified/entries.json',JSON.stringify(entries,null,2));fs.writeFileSync('/tmp/tab-verified/source-sha256.json',JSON.stringify(hashes,null,2));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-tab-control
          path: /tmp/tab-verified/
          retention-days: 3
