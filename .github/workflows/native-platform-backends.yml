name: Native extension platform backends
on:
  push:
    branches: [fix/review-hardening-20261031]
    paths: ['.github/workflows/native-platform-backends.yml']
permissions:
  contents: read
jobs:
  original:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm run build:chrome
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.57.0
      - run: npx playwright install --with-deps chromium
      - name: Install standard Mesa CPU Vulkan driver
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers vulkan-tools
      - name: Prepare browser configuration only; keep production byte-for-byte
        shell: bash
        run: |
          mkdir -p test-results/native-extension
          node --input-type=module <<'JS'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          let s=fs.readFileSync('test/native-extension/real-extension.mjs','utf8');
          s=s.replace('files[relative(dir, file)]',"files[relative(dir, file).split(String.fromCharCode(92)).join('/')]");
          const anchor="'--use-angle=swiftshader',\n      '--enable-unsafe-webgpu', '--enable-unsafe-swiftshader', '--disable-dev-shm-usage'";
          assert.ok(s.includes(anchor));
          const flags=process.platform==='darwin'?['--use-angle=metal','--enable-unsafe-webgpu']:
            process.platform==='win32'?['--use-angle=d3d11-warp','--use-webgpu-adapter=d3d11','--enable-unsafe-webgpu','--ignore-gpu-blocklist']:
            ['--use-angle=vulkan','--enable-features=Vulkan,DefaultANGLEVulkan,VulkanFromANGLE','--enable-unsafe-webgpu','--ignore-gpu-blocklist','--disable-vulkan-surface','--disable-dev-shm-usage'];
          s=s.replace(anchor,flags.map(f=>JSON.stringify(f)).join(','));
          s=s.replace("return a ? { vendor: a.info?.vendor, architecture: a.info?.architecture } : null;","return a ? { vendor: a.info?.vendor, architecture: a.info?.architecture, description:a.info?.description, device:a.info?.device, features:[...a.features], limits:{maxBufferSize:a.limits.maxBufferSize,maxStorageBufferBindingSize:a.limits.maxStorageBufferBindingSize} } : null;");
          const after="await passed('installed-extension-and-onboarding', { serviceWorker: sw.url(), adapter: summary.adapter });";
          assert.ok(s.includes(after));
          s=s.replace(after,after+"\n  assert.ok(summary.adapter, 'requested platform has a real WebGPU adapter'); assert.ok(!/swiftshader/i.test(JSON.stringify(summary.adapter)), 'do not repeat the already tested SwiftShader fallback under another platform label');");
          fs.writeFileSync('.native-platform-run.mjs',s);
          fs.writeFileSync('test-results/native-extension/platform.json',JSON.stringify({platform:process.platform,flags,productionUnchanged:true},null,2));
          JS
      - name: Actual installed extension, original model, translation and exact restore
        shell: bash
        env:
          HEADED: '1'
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Linux ]; then
            export VK_ICD_FILENAMES="$(find /usr/share/vulkan/icd.d -name '*lvp*.json' -print -quit)"
            test -n "$VK_ICD_FILENAMES"
            xvfb-run -a node .native-platform-run.mjs 2>&1 | tee test-results/native-extension/execution.log
          else
            node .native-platform-run.mjs 2>&1 | tee test-results/native-extension/execution.log
          fi
      - name: Verify production files unchanged
        if: always()
        run: git diff --exit-code -- src scripts package.json package-lock.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-platform-${{ matrix.os }}-${{ github.run_id }}
          path: test-results/native-extension/
          retention-days: 7
