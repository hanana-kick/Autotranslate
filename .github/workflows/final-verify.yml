name: Verify final safety fixes
on:
  push:
    branches: [fix/review-hardening-20261031]
    paths: ['.github/workflows/final-verify.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply integrity-checked source changes
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import zlib from 'node:zlib';import crypto from 'node:crypto';import assert from 'node:assert/strict';import {execFileSync} from 'node:child_process';
          const payload='';
          const patch=zlib.brotliDecompressSync(Buffer.from(payload,'base64'));
          assert.equal(crypto.createHash('sha256').update(patch).digest('hex'),'c11f1761939d5f64badf9e208bbf0120c9e34a6318d8b6fd851e10771bb4e399');
          const paths=[...patch.toString().matchAll(/^diff --git a\/(.+) b\/(.+)$/gm)].map(m=>m[2]);
          execFileSync('git',['diff','--exit-code','f9a0f38079ff11c40459dcf1a021c9cf8b639851','HEAD','--',...paths]);
          fs.mkdirSync('/tmp/final-export',{recursive:true});fs.writeFileSync('/tmp/final-export/paths.json',JSON.stringify(paths));fs.writeFileSync('/tmp/final.patch',patch);
          execFileSync('git',['apply','--index','/tmp/final.patch'],{stdio:'inherit'});execFileSync('git',['diff','--cached','--check'],{stdio:'inherit'});
          JS
      - run: npm ci --no-audit --no-fund && npm run typecheck && npm test && npm run build
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.57.0 && npx playwright install --with-deps chromium
      - run: node --test test/browser/dom.test.mjs
      - name: Export exact validated blobs without updating branch refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import {execFileSync} from 'node:child_process';
          const api=async(path,body)=>{const r=await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/${path}`,{method:body?'POST':'GET',headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});const d=await r.json();if(!r.ok)throw Error(`${path}: ${r.status}`);return d;};
          const parent=process.env.GITHUB_SHA,base=await api(`git/commits/${parent}`),entries=[];
          for(const path of JSON.parse(fs.readFileSync('/tmp/final-export/paths.json','utf8'))){const blob=await api('git/blobs',{content:fs.readFileSync(path,'utf8'),encoding:'utf-8'});if(blob.sha!==execFileSync('git',['hash-object',path],{encoding:'utf8'}).trim())throw Error('blob hash mismatch');entries.push({path,mode:'100644',type:'blob',sha:blob.sha});}
          fs.writeFileSync('/tmp/final-export/blobs.json',JSON.stringify({parent,baseTree:base.tree.sha,entries},null,2));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-final-${{ github.run_id }}
          path: /tmp/final-export/
          retention-days: 3
