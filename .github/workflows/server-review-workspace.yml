name: Server candidate workspace
on:
  push:
    branches: [feat/openai-compatible-server]
    paths: [.github/workflows/server-review-workspace.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - name: Archive source and public dependencies only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/server-workspace"
          git archive HEAD | gzip > "$RUNNER_TEMP/server-workspace/source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/server-workspace/commit.txt"
          git bundle create "$RUNNER_TEMP/server-workspace/repository.bundle" --all
          tar -czf "$RUNNER_TEMP/server-workspace/deps.tar.gz" node_modules
          cp "$(command -v node)" "$RUNNER_TEMP/server-workspace/node"
      - uses: actions/upload-artifact@v4
        with:
          name: server-candidate-workspace
          path: ${{ runner.temp }}/server-workspace/
          retention-days: 2
