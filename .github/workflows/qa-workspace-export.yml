name: Native test workspace
on:
  push:
    branches: [fix/review-hardening-20261031]
    paths: ['.github/workflows/qa-workspace-export.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm run build:chrome
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.57.0
      - name: Export public source and tooling only
        run: |
          mkdir -p /tmp/native-test-workspace
          git rev-parse HEAD > /tmp/native-test-workspace/commit.txt
          tar --exclude=.git --exclude=dist --exclude=test-results -czf /tmp/native-test-workspace/source.tar.gz .
          cp "$(command -v node)" /tmp/native-test-workspace/node
      - uses: actions/upload-artifact@v4
        with:
          name: native-test-workspace
          path: /tmp/native-test-workspace/
          retention-days: 3
