name: QA source workspace
on:
  push:
    branches: [fix/review-hardening-20261031]
    paths: [.github/workflows/qa-workspace-export.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: |
          mkdir -p /tmp/qa-workspace
          git archive HEAD > /tmp/qa-workspace/source.tar
          tar -czf /tmp/qa-workspace/deps.tar.gz node_modules
          git rev-parse HEAD > /tmp/qa-workspace/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qa-source-workspace
          path: /tmp/qa-workspace/
          retention-days: 2
