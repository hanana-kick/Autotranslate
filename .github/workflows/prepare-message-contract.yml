name: Verify Promise message contract
on:
  push:
    branches: [fix/review-hardening-20261031]
    paths: [.github/workflows/prepare-message-contract.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply exact reviewed message-contract change
        run: |
          mkdir -p /tmp/message-contract
          node --input-type=module <<'JS'
          import fs from 'node:fs'; import assert from 'node:assert/strict'; import {execFileSync} from 'node:child_process';
          const paths=['src/lib/browser.ts','test/background.test.ts','test/content.test.ts','test/messages.test.ts'];
          const before=['9944f59eaaeed0cf64daab4521c8bfddf8a1de4d','be5ea4ec5982a7124c315b81806cddd69bb23490','5b0e31d681607b47a8ffb35ab2af10b7eb97bbaf','8cf75394178e39631120fff3d1a0bde8564a4828'];
          const after=['8cd766ad655cb15535a116e8b0a5899fbb1588ae','a6497e58a5f515d02c2a92ee7cf3297962135a14','6c2f691f3d23701c5249f2e59c77e92dda8c0a66','22d5c93893e4cde8772bcaf5773651893d7331d1'];
          const hash=p=>execFileSync('git',['hash-object',p],{encoding:'utf8'}).trim();
          paths.forEach((p,i)=>assert.equal(hash(p),before[i],'base changed: '+p));
          const replace=(p,a,b)=>{let s=fs.readFileSync(p,'utf8');assert.equal(s.split(a).length,2,p+' anchor');fs.writeFileSync(p,s.replace(a,b));};
          replace(paths[0],') => boolean;\n\n  /** Rejections',') => boolean | Promise<Response>;\n\n  /** Rejections');
          replace(paths[0],`  // Returns true from the listener and answers via sendResponse, which works
            // identically in Chrome and Firefox.`, `  // Return the actual reply Promise through the standard browser API. Firefox
            // owns this pending asynchronous response for the event-page lifetime; the
            // Chrome polyfill converts it to its callback contract. A raw chrome fallback
            // retains sendResponse for hosts that do not support promise listeners.`);
          replace(paths[0],`      Promise.resolve()
                  .then(() => handler(message, sender))
                  .then((result) => sendResponse({ ok: true, ...(result ?? {}) }))`, `      const reply: Promise<Response> = Promise.resolve()
                  .then(() => handler(message, sender))
                  .then((result) => ({ ok: true, ...(result ?? {}) }))`);
          replace(paths[0],`          sendResponse({
                      ok: false,
                      error: rejection?.message ?? String(error),
                      code: rejection?.code ?? null
                    });
                  });
                return true;`, `          return {
                      ok: false,
                      error: rejection?.message ?? String(error),
                      code: rejection?.code ?? null
                    };
                  });
                if (globals.browser === extensionApi) return reply;
                void reply.then(sendResponse);
                return true;`);
          replace(paths[1],'if (!willAnswer.includes(true)) resolve(silence);',`const promises = willAnswer.filter((value): value is Promise<unknown> => value instanceof Promise);
              for (const promise of promises) void promise.then(respond);
              if (!willAnswer.includes(true) && promises.length === 0) resolve(silence);`);
          replace(paths[2],'if (!willAnswer.includes(true)) resolve(silence);',`const promises = willAnswer.filter((value): value is Promise<unknown> => value instanceof Promise);
                for (const promise of promises) void promise.then(respond);
                if (!willAnswer.includes(true) && promises.length === 0) resolve(silence);`);
          replace(paths[3],`// lets handlers be plain async functions, the keep-alive contract (\x60true\x60 from
          // the listener, the answer delivered later through sendResponse), the failure`,`// lets handlers be plain async functions, the Promise response lifetime (with
          // a raw Chrome callback fallback), the failure`);
          replace(paths[3],'=> boolean;','=> boolean | Promise<unknown>;');
          replace(paths[3],`  const keptChannel = listener(message, sender, (value) => {
              response = value;
              answered = true;
            }) === true;
            await flush();`,`  const result = listener(message, sender, (value) => {
              response = value;
              answered = true;
            });
            const keptChannel = result === true || result instanceof Promise;
            if (result instanceof Promise) { response = await result; answered = true; }
            await flush();`);
          replace(paths[3],"'the listener must return true and answer later'","'the standard API must own the asynchronous reply'");
          fs.appendFileSync(paths[3],`\n
          test('standard browser listener returns the real pending operation, not a detached callback', async () => {
            const { AT, listeners } = boot({});
            let finish!: (value: unknown) => void;
            const operation = new Promise((resolve) => { finish = resolve; });
            AT.onMessage({ 'at/long': () => operation });
            const response = listeners[0]!({type:'at/long'}, {}, () => assert.fail('standard API must not call sendResponse'));
            assert.ok(response instanceof Promise);
            let settled=false;
            void response.then(()=>{settled=true;});
            await flush(); assert.equal(settled,false);
            finish({ status:'ready' });
            assert.deepEqual(await response,{ok:true,status:'ready'});
          });

          test('raw Chrome listener preserves its asynchronous callback fallback', async () => {
            resetGlobals();
            const listeners: Listener[]=[];
            const host=globalThis as unknown as Record<string,unknown>;
            host.chrome={runtime:{onMessage:{addListener:(listener:Listener)=>listeners.push(listener)}}};
            const AT=load('lib/constants.js','lib/browser.js');
            AT.onMessage({'at/x':async()=>({value:4})});
            let answer:unknown;
            assert.equal(listeners[0]!({type:'at/x'}, {}, value=>{answer=value;}),true);
            await flush(); assert.deepEqual(answer,{ok:true,value:4});
          });
          `);
          paths.forEach((p,i)=>assert.equal(hash(p),after[i],'output changed: '+p));
          JS
          git diff -- src test > /tmp/message-contract/change.patch
      - run: npm ci --no-audit --no-fund
      - name: Full production validation with Node 24
        run: |
          set -euo pipefail
          npm run ci 2>&1 | tee /tmp/message-contract/ci.log
      - name: Export verified blobs without moving the branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const root='https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY+'/';
          async function api(path,body){const r=await fetch(root+path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});if(!r.ok)throw Error(path+': '+r.status);return r.json();}
          const parent=process.env.GITHUB_SHA,base=await api('git/commits/'+parent),entries=[];
          for(const path of ['src/lib/browser.ts','test/background.test.ts','test/content.test.ts','test/messages.test.ts']){const b=await api('git/blobs',{content:fs.readFileSync(path,'utf8'),encoding:'utf-8'});entries.push({path,mode:'100644',type:'blob',sha:b.sha});}
          fs.writeFileSync('/tmp/message-contract/blobs.json',JSON.stringify({parent,baseTree:base.tree.sha,entries},null,2));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-message-contract
          path: /tmp/message-contract/
          retention-days: 3
