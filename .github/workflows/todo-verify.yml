name: Validate TODO proposal
on:
  push:
    branches: [fix/review-hardening-20261031]
    paths: ['.github/workflows/todo-verify.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify payload and unchanged source baseline
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import zlib from 'node:zlib';import crypto from 'node:crypto';import assert from 'node:assert/strict';import {execFileSync} from 'node:child_process';
          const data=Array.from({length:4},(_,i)=>fs.readFileSync(`.github/todo-transfer/part-${i}.b64`,'utf8').trim()).join('');
          const patch=zlib.brotliDecompressSync(Buffer.from(data,'base64'));
          assert.equal(crypto.createHash('sha256').update(patch).digest('hex'),'6995a6d1fa24d31eaead709c7f538c861ee75312a7de23da936bf891daed938a');
          const paths=[...patch.toString().matchAll(/^diff --git a\/(.+) b\/(.+)$/gm)].map(m=>m[2]);
          execFileSync('git',['diff','--exit-code','911f5db8ee16b1ff0783af6033f8ee430e655a4e','HEAD','--',...paths]);
          fs.mkdirSync('/tmp/todo-export',{recursive:true});fs.writeFileSync('/tmp/todo-export/paths.json',JSON.stringify(paths));fs.writeFileSync('/tmp/todo.patch',patch);
          execFileSync('git',['apply','--index','--unidiff-zero','/tmp/todo.patch'],{stdio:'inherit'});
          execFileSync('git',['diff','--cached','--check'],{stdio:'inherit'});
          JS
      - run: npm ci --no-audit --no-fund
      - name: Type, unit, build and package verification
        run: npm run ci
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.57.0
      - run: npx playwright install --with-deps chromium
      - name: Real DOM regression and planner acceptance (deterministic provider only)
        env:
          PLANNER_ENFORCE: '1'
        run: |
          node --test test/browser/dom.test.mjs
          node test/optimization/planner-audit.mjs
      - name: Export validated source objects without updating branch refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import {execFileSync} from 'node:child_process';
          const api=async(path,body)=>{const r=await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/${path}`,{method:body?'POST':'GET',headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});const d=await r.json();if(!r.ok)throw Error(`${path}: ${r.status}`);return d;};
          const parent=process.env.GITHUB_SHA,base=await api(`git/commits/${parent}`),entries=[];
          for(const path of JSON.parse(fs.readFileSync('/tmp/todo-export/paths.json','utf8'))){const content=fs.readFileSync(path,'utf8');const blob=await api('git/blobs',{content,encoding:'utf-8'});const expected=execFileSync('git',['hash-object',path],{encoding:'utf8'}).trim();if(blob.sha!==expected)throw Error('blob hash mismatch');entries.push({path,mode:'100644',type:'blob',sha:blob.sha});}
          const result={parent,baseTree:base.tree.sha,entries};fs.writeFileSync('/tmp/todo-export/blobs.json',JSON.stringify(result,null,2));console.log(JSON.stringify(result));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validated-todo-${{ github.run_id }}
          path: |
            /tmp/todo-export/
            test-results/planner/
            test-results/browser/
          retention-days: 3
