name: Optimization workspace
on:
  push:
    branches: [fix/review-hardening-20261031]
    paths: [.github/workflows/optimization-workspace.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.57.0
      - name: Export exact source and tools for isolated local checks
        run: |
          mkdir -p "$RUNNER_TEMP/optimization-workspace"
          tar --exclude=.git --exclude=build --exclude=dist -czf "$RUNNER_TEMP/optimization-workspace/source.tar.gz" .
          cp "$(command -v node)" "$RUNNER_TEMP/optimization-workspace/node"
          git rev-parse HEAD > "$RUNNER_TEMP/optimization-workspace/commit.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: optimization-workspace
          path: ${{ runner.temp }}/optimization-workspace/
          retention-days: 3
          if-no-files-found: error
