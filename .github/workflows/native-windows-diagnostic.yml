name: Native extension Windows diagnosis
on:
  push:
    branches: [fix/review-hardening-20261031]
    paths: ['.github/workflows/native-windows-diagnostic.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund && npm run build:chrome
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.57.0
      - run: npx playwright install chromium
      - name: Windows launch options only - production bundle remains unchanged
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          let script=fs.readFileSync('test/native-extension/real-extension.mjs','utf8');
          const from="'--use-angle=swiftshader',\n      '--enable-unsafe-webgpu', '--enable-unsafe-swiftshader', '--disable-dev-shm-usage'";
          if(!script.includes(from))throw Error('test launch configuration changed');
          script=script.replace(from,"'--use-angle=d3d11-warp', '--enable-unsafe-webgpu'");
          script=script.replace("{ vendor: a.info?.vendor, architecture: a.info?.architecture }","{ vendor: a.info?.vendor, architecture: a.info?.architecture, description: a.info?.description, features: [...a.features] }");
          script=script.replace("await welcome.locator('#targetLang').selectOption('ko');","console.log(JSON.stringify({actualAdapter:summary.adapter})); assert.ok(summary.adapter, 'WebGPU must be provided by the actual browser'); await welcome.locator('#targetLang').selectOption('ko');");
          fs.writeFileSync('.native-windows-diagnostic.mjs',script);
          JS
      - name: Actual installed extension - unchanged SDK and model
        env:
          HEADED: '1'
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p test-results/native-extension
          node .native-windows-diagnostic.mjs 2>&1 | tee test-results/native-extension/execution.log
      - name: Production files unchanged
        if: always()
        run: git diff --exit-code -- src scripts package.json package-lock.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-windows-${{ github.run_id }}
          path: test-results/native-extension/
          retention-days: 7
