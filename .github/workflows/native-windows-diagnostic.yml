name: Native extension observed diagnosis
on:
  push:
    branches: [fix/review-hardening-20261031]
    paths: ['.github/workflows/native-windows-diagnostic.yml']
permissions:
  contents: read
jobs:
  observed:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund && npm run build:chrome
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.57.0
      - run: npx playwright install --with-deps chromium
      - name: Actual installed extension with read-only worker diagnostics
        env:
          HEADED: '1'
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p test-results/native-extension
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a node test/diagnostics/run-native-diagnostic.mjs 2>&1 | tee test-results/native-extension/execution.log
          else
            node test/diagnostics/run-native-diagnostic.mjs 2>&1 | tee test-results/native-extension/execution.log
          fi
      - name: Production files unchanged
        if: always()
        run: git diff --exit-code -- src scripts package.json package-lock.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-observed-${{ matrix.os }}-${{ github.run_id }}
          path: test-results/native-extension/
          retention-days: 7
