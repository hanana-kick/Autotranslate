<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Autotranslate options</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="options">
    <main>
      <h1 data-i18n="options_title"></h1>

      <section class="card">
        <h2 data-i18n="options_behavior"></h2>
        <div class="grid">
          <label class="switch">
            <input type="checkbox" id="enabled" />
            <span data-i18n="options_enabled"></span>
          </label>
          <label class="switch">
            <input type="checkbox" id="autoDetect" />
            <span data-i18n="options_autoDetect"></span>
          </label>
          <label class="switch">
            <input type="checkbox" id="showBadge" />
            <span data-i18n="options_showBadge"></span>
          </label>
          <label class="switch">
            <input type="checkbox" id="debug" />
            <span data-i18n="options_debug"></span>
          </label>
        </div>
      </section>

      <section class="card">
        <h2 data-i18n="options_provider"></h2>
        <div class="grid">
          <div class="field">
            <label for="engine" data-i18n="options_engine"></label>
            <select id="engine"></select>
          </div>
          <div class="field" id="endpointField">
            <label for="endpoint" data-i18n="options_endpoint"></label>
            <input type="url" id="endpoint" spellcheck="false" autocomplete="off" />
          </div>
          <div class="field" id="apiKeyField">
            <label for="apiKey" data-i18n="options_apiKey"></label>
            <input type="password" id="apiKey" spellcheck="false" autocomplete="off" />
          </div>
          <p class="hint" id="engineDocs"></p>
          <div class="row">
            <button id="testEngine" type="button" data-i18n="options_test"></button>
            <p class="status" id="testStatus" role="status"></p>
          </div>
        </div>
      </section>

      <section class="card">
        <h2 data-i18n="options_local"></h2>
        <div class="grid">
          <p class="hint" id="localSupport" data-i18n="options_localHint"></p>
          <div class="field">
            <label for="localModel" data-i18n="options_localModel"></label>
            <select id="localModel"></select>
          </div>
          <div class="field">
            <label for="localMaxTokens" data-i18n="options_localMaxTokens"></label>
            <input type="number" id="localMaxTokens" min="128" max="8192" step="128" />
          </div>
          <div class="field">
            <label for="fallbackEngine" data-i18n="options_fallbackEngine"></label>
            <select id="fallbackEngine"></select>
          </div>
          <p class="hint" id="localUsage"></p>
          <ul class="rules" id="modelList"></ul>
          <div class="field">
            <label for="modelUrl" data-i18n="options_modelUrl"></label>
            <input type="url" id="modelUrl" spellcheck="false" autocomplete="off" />
          </div>
          <div class="field">
            <label for="modelToken" data-i18n="options_modelToken"></label>
            <input type="password" id="modelToken" spellcheck="false" autocomplete="off" />
          </div>
          <p class="hint" data-i18n="options_modelTokenHint"></p>
          <div class="row wrap">
            <button id="downloadModel" type="button" data-i18n="options_download"></button>
            <button id="cancelDownload" type="button" class="secondary" data-i18n="options_cancel" hidden></button>
            <input type="file" id="modelFile" accept=".task,application/octet-stream" hidden />
            <button id="pickModel" type="button" class="secondary" data-i18n="options_pickFile"></button>
            <button id="prepareModel" type="button" class="secondary" data-i18n="options_prepare"></button>
          </div>
          <progress id="modelProgress" max="100" value="0" hidden></progress>
          <p class="status" id="modelStatus" role="status"></p>
        </div>
      </section>

      <section class="card">
        <h2 data-i18n="options_languages"></h2>
        <div class="grid">
          <div class="field">
            <label for="targetLang" data-i18n="options_targetLang"></label>
            <select id="targetLang"></select>
          </div>
          <div class="field">
            <label for="sourceLang" data-i18n="options_sourceLang"></label>
            <select id="sourceLang"></select>
          </div>
        </div>
      </section>

      <section class="card">
        <h2 data-i18n="options_limits"></h2>
        <div class="grid">
          <div class="field">
            <label for="batchChars" data-i18n="options_batchChars"></label>
            <input type="number" id="batchChars" min="100" max="8000" step="100" />
          </div>
          <div class="field">
            <label for="maxNodes" data-i18n="options_maxNodes"></label>
            <input type="number" id="maxNodes" min="10" max="5000" step="10" />
          </div>
        </div>
      </section>

      <section class="card">
        <h2 data-i18n="options_rules"></h2>
        <div class="row wrap">
          <input
            type="text"
            id="rulePattern"
            class="grow"
            data-i18n-placeholder="options_rulePlaceholder"
            spellcheck="false"
          />
          <select id="ruleAction">
            <option value="always" data-i18n="options_ruleAlways"></option>
            <option value="never" data-i18n="options_ruleNever"></option>
          </select>
          <button id="addRule" type="button" data-i18n="options_addRule"></button>
        </div>
        <ul class="rules" id="ruleList"></ul>
      </section>

      <footer class="row">
        <button id="save" type="button" data-i18n="options_save"></button>
        <button id="reset" type="button" class="secondary" data-i18n="options_reset"></button>
        <p class="status" id="saveStatus" role="status"></p>
      </footer>
    </main>

    <script src="vendor/browser-polyfill.js"></script>
    <script src="lib/constants.js"></script>
    <script src="lib/browser.js"></script>
    <script src="lib/rules.js"></script>
    <script src="lib/local.js"></script>
    <script src="lib/modelstore.js"></script>
    <script src="lib/settings.js"></script>
    <script src="options.js"></script>
  </body>
</html>
