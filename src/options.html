<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Autotranslate options</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="options">
    <at-shell>
    <main>
      <header class="page-head">
        <h1 data-i18n="options_title"></h1>
      </header>

      <at-panel>
        <h2 data-i18n="options_behavior"></h2>
        <p class="host" id="tabHost"></p>
        <p class="hint" id="tabStatus" role="status"></p>
        <label class="switch">
          <input type="checkbox" id="enabled" disabled />
          <span data-i18n="options_enabled"></span>
        </label>
      </at-panel>

      <at-panel id="localSection">
        <h2 data-i18n="options_local"></h2>
        <div class="stack">
          <p class="hint" data-i18n="options_localHint"></p>
          <div class="field">
            <label for="localModel" data-i18n="options_localModel"></label>
            <select id="localModel"></select>
          </div>
          <ul class="rules" id="modelList"></ul>
          <div class="row wrap">
            <button id="downloadModel" type="button" data-i18n="options_download"></button>
            <button id="cancelDownload" type="button" class="secondary" data-i18n="options_cancel" hidden></button>
            <input type="file" id="modelFile" accept=".onnx,.json,.jinja,application/json,application/octet-stream" multiple hidden />
            <button id="pickModel" type="button" class="secondary" data-i18n="options_pickFile"></button>
            <button id="prepareModel" type="button" class="secondary" data-i18n="options_prepare"></button>
          </div>
          <p class="hint" data-i18n="options_pickFileHint"></p>
          <progress id="modelProgress" max="100" value="0" hidden></progress>
          <p class="status" id="modelStatus" role="status"></p>
        </div>
      </at-panel>

      <at-panel>
        <h2 data-i18n="options_languages"></h2>
        <div class="field">
          <label for="targetLang" data-i18n="options_targetLang"></label>
          <select id="targetLang"></select>
        </div>
        <label class="switch">
          <input type="checkbox" id="parallelTranslation" aria-describedby="parallelTranslationHint" />
          <span data-i18n="options_parallelTranslation"></span>
        </label>
        <p class="hint" id="parallelTranslationHint" data-i18n="options_parallelTranslationHint"></p>
      </at-panel>

      <at-panel>
        <h2 data-i18n="options_rules"></h2>
        <div class="row wrap">
          <input
            type="text"
            id="rulePattern"
            class="grow"
            data-i18n-placeholder="options_rulePlaceholder"
            spellcheck="false"
          />
          <button id="addRule" type="button" data-i18n="options_addRule"></button>
        </div>
        <p class="hint" data-i18n="options_rulesHint"></p>
        <ul class="rules" id="ruleList"></ul>
      </at-panel>

      <at-panel>
        <h2 id="alwaysLanguagesLabel" data-i18n="options_alwaysLanguages"></h2>
        <p class="hint" id="alwaysLanguagesHint" data-i18n="options_alwaysLanguagesHint"></p>
        <div id="alwaysTranslateLanguages" class="language-checklist" role="group"
          aria-labelledby="alwaysLanguagesLabel" aria-describedby="alwaysLanguagesHint"></div>
      </at-panel>

      <footer class="row actions">
        <button id="save" type="button" data-i18n="options_save"></button>
        <p class="status" id="saveStatus" role="status"></p>
      </footer>
    </main>
    </at-shell>

    <script src="vendor/browser-polyfill.js"></script>
    <script src="lib/constants.js"></script>
    <script src="lib/browser.js"></script>
    <script src="lib/rules.js"></script>
    <script src="lib/local.js"></script>
    <script src="lib/modelstore.js"></script>
    <script src="lib/modelflow.js"></script>
    <script src="lib/settings.js"></script>
    <script src="lib/components.js"></script>
    <script src="lib/ui.js"></script>
    <script src="options.js"></script>
  </body>
</html>
